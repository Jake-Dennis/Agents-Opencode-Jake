[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --continue-on-collection-errors
# --continue-on-collection-errors: legacy script-style tests (test_setup.py,
# test_integration.py) call sys.exit(0) at module level. Pytest treats this as
# a collection error. The flag tells pytest to continue running the rest of the
# suite. Layer 2 task #9 will refactor these into pytest-native test functions.
