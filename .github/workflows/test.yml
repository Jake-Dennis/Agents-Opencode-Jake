name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema networkx
        shell: pwsh

      - name: Run pytest (schema + conductor workflow)
        run: |
          python -m pytest tests/test_schema.py tests/test_conductor_workflow.py -v --tb=short
        shell: pwsh

      - name: Run script-style tests
        run: |
          python tests/test_setup.py
          python tests/test_agents_v2.py
          python tests/test_integration.py
        shell: pwsh

      - name: Validate opencode.json
        run: |
          python -c "import json; json.load(open('opencode.json', encoding='utf-8'))"
          python -c "import json, jsonschema; cfg = json.load(open('opencode.json', encoding='utf-8')); schema = json.load(open('opencode.schema.json', encoding='utf-8')); jsonschema.validate(cfg, schema); print('schema OK')"
        shell: pwsh
