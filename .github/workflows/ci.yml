name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: Validate opencode.json
        run: python -c "import json; json.load(open('opencode.json'))"

      - name: Validate against schema
        run: python -c "import jsonschema, json; jsonschema.validate(json.load(open('opencode.json')), json.load(open('opencode.schema.json')))"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run verify-plan on archived plans
        run: |
          python scripts/verify-plan.py .opencode/plans/completed/plan-014-full-improvements.md
        continue-on-error: true

      - name: Run .bat quick syntax check
        run: |
          python -c "
import re, subprocess
for bat in ['setup.bat', 'global-setup.bat', 'uninstall.bat', 'uninstall-global.bat']:
    with open(bat) as f:
        content = f.read()
    # Check that all .bat files start with @echo off
    assert content.startswith('@echo off') or content.startswith('@ECHO OFF'), f'{bat} missing @echo off'
    # No :: inside parens (parser-safety)
    paren_depth = 0
    for i, line in enumerate(content.splitlines(), 1):
        paren_depth += line.count('(') - line.count(')')
        if '::' in line and paren_depth > 0:
            print(f'WARN: {bat}:{i} :: inside parens block')
    print(f'OK: {bat} ({len(content)} bytes, {len(content.splitlines())} lines)')
"
