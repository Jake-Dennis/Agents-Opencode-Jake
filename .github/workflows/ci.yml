name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache pip (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema networkx hypothesis
        shell: pwsh

      - name: Validate opencode.json
        run: |
          python -c "import json; json.load(open('opencode.json', encoding='utf-8'))"
          python -c "import jsonschema, json; jsonschema.validate(json.load(open('opencode.json', encoding='utf-8')), json.load(open('opencode.schema.json', encoding='utf-8')))"
        shell: pwsh

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short
        shell: pwsh

      - name: Run verify-plan on archived plans
        run: python scripts/verify-plan.py .opencode/plans/completed/plan-014-full-improvements.md
        shell: pwsh
        continue-on-error: true

      - name: Run .bat syntax check (Windows only)
        if: runner.os == 'Windows'
        run: |
          python -c "
          import re
          for bat in ['setup.bat', 'global-setup.bat', 'uninstall.bat', 'uninstall-global.bat']:
              with open(bat) as f:
                  content = f.read()
              assert content.startswith('@echo off') or content.startswith('@ECHO OFF'), f'{bat} missing @echo off'
              paren_depth = 0
              for i, line in enumerate(content.splitlines(), 1):
                  paren_depth += line.count('(') - line.count(')')
                  if '::' in line and paren_depth > 0:
                      print(f'WARN: {bat}:{i} :: inside parens block')
              print(f'OK: {bat} ({len(content)} bytes, {len(content.splitlines())} lines)')
          "
        shell: pwsh

      - name: Run .sh syntax check (Mac/Linux only)
        if: runner.os != 'Windows'
        run: |
          for sh in global-setup.sh uninstall-global.sh setup.sh uninstall.sh test_fresh_install.sh; do
              if [ -f "$sh" ]; then
                  bash -n "$sh" && echo "OK: $sh syntax valid"
              fi
          done

      - name: Run fresh install test (Mac/Linux only)
        if: runner.os != 'Windows'
        run: |
          echo "Running fresh install validation..."
          # Set HOME to a temp dir so we don't pollute the real config
          export HOME="$RUNNER_TEMP/fake-home"
          mkdir -p "$HOME"
          # Run the test (it will backup, install, validate, uninstall, restore)
          bash test_fresh_install.sh < /dev/null || echo "Fresh install test completed (interactive prompts may have been skipped)"